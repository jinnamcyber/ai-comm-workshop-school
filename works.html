<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>作品牆 · 講者用</title>
<style>
:root{--ink:#f4f1ff;--mut:#b9b3dd;--acc:#7ae0ff;--acc2:#9ff0b8}
*{box-sizing:border-box}
html,body{margin:0;height:100%}
body{font-family:-apple-system,"PingFang TC","Noto Sans TC","Microsoft JhengHei",sans-serif;color:var(--ink);background:radial-gradient(ellipse at 50% 30%,#2a1f6b 0%,#1b1446 45%,#0b2a45 100%);display:flex;flex-direction:column}
header{display:flex;align-items:center;gap:18px;padding:14px 24px}
h1{margin:0;font-size:clamp(22px,2.4vw,34px);letter-spacing:.08em}
#count{color:var(--mut);font-size:clamp(14px,1.4vw,20px)}
.sp{flex:1}
.qrmini{display:flex;align-items:center;gap:12px;background:#fff;color:#222;border-radius:14px;padding:6px 14px 6px 6px;font-weight:700;font-size:clamp(13px,1.3vw,18px)}
.qrmini img{width:clamp(64px,7vw,110px);height:clamp(64px,7vw,110px);display:block}
#grid{flex:1;overflow:auto;padding:6px 24px 28px;display:grid;grid-template-columns:repeat(auto-fill,minmax(260px,1fr));gap:16px;align-content:start}
.c{background:#ffffff14;border:1px solid #ffffff2a;border-radius:20px;padding:18px 20px;cursor:pointer;text-align:left;color:inherit;font:inherit;animation:pop .5s cubic-bezier(.2,1.5,.4,1) both;transition:transform .15s,background .15s}
.c:hover,.c:focus-visible{transform:translateY(-3px);background:#ffffff24;outline:2px solid var(--acc)}
@keyframes pop{from{opacity:0;transform:scale(.7)}to{opacity:1;transform:none}}
.c .t{font-size:clamp(18px,1.8vw,26px);font-weight:800;line-height:1.3;word-break:break-word}
.c .n{margin-top:8px;color:var(--acc);font-size:clamp(14px,1.3vw,18px)}
.c .m{margin-top:10px;display:flex;gap:8px;align-items:center;color:var(--mut);font-size:13px}
.tag{border-radius:999px;padding:2px 10px;background:#7ae0ff26;color:var(--acc);font-weight:700}
.tag.l{background:#9ff0b826;color:var(--acc2)}
#empty{position:fixed;inset:0;display:flex;align-items:center;justify-content:center;flex-direction:column;gap:12px;color:var(--mut);font-size:clamp(18px,2.2vw,28px);text-align:center;pointer-events:none}
#viewer{position:fixed;inset:0;background:#0b0b1ff0;display:none;flex-direction:column;z-index:9}
#viewer.on{display:flex}
#vbar{display:flex;align-items:center;gap:14px;padding:10px 18px;background:#1b1446}
#vt{font-weight:800;font-size:clamp(16px,1.8vw,24px);flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
#vbar button,#vbar a{border:0;border-radius:999px;padding:8px 18px;font:inherit;font-size:16px;font-weight:700;color:#06263a;background:linear-gradient(90deg,var(--acc),var(--acc2));cursor:pointer;text-decoration:none}
#vbar button.x{background:#ffffff24;color:var(--ink)}
#frame{flex:1;border:0;width:100%;background:#fff}
#linkview{flex:1;display:none;align-items:center;justify-content:center;flex-direction:column;gap:20px;text-align:center;padding:30px}
#linkview a{font-size:clamp(20px,2.6vw,34px);padding:16px 38px}
#linkview .u{color:var(--mut);word-break:break-all;max-width:80vw;font-size:16px}
</style>
</head>
<body>
<header>
  <h1>📤 作品牆</h1><div id="count">0 份作品</div><div class="sp"></div>
  <div class="qrmini"><img id="qrimg" alt="QR" src="share-qr.svg"><span>掃碼上傳作品</span></div>
</header>
<div id="grid"></div>
<div id="empty"><div style="font-size:60px">📤</div><div>掃右上角 QR，將作品傳上嚟<br>一傳就喺度出現</div></div>
<div id="viewer">
  <div id="vbar"><div id="vt"></div><a id="vopen" target="_blank" rel="noopener noreferrer" style="display:none">新分頁打開 ↗</a><button class="x" id="vx">關閉 ✕</button></div>
  <iframe id="frame" sandbox="allow-scripts allow-forms allow-modals allow-popups" referrerpolicy="no-referrer" title="作品預覽"></iframe>
  <div id="linkview"><div id="lt" style="font-size:clamp(18px,2vw,26px)"></div><a id="lopen" class="b" target="_blank" rel="noopener noreferrer">打開作品連結 ↗</a><div class="u" id="lu"></div></div>
</div>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.min.js"></script>
<script src="work-config.js"></script>
<script>
(function(){
  var $=function(i){return document.getElementById(i)};
  var rows=[],seen={};
  var sb=window.supabase.createClient(WORK_CFG.url,WORK_CFG.key);
  function tm(s){var d=new Date(s);return d.getHours()+':'+String(d.getMinutes()).padStart(2,'0')}
  function card(r){
    var b=document.createElement('button');b.className='c';b.type='button';
    var t=document.createElement('div');t.className='t';t.textContent=r.title;
    var n=document.createElement('div');n.className='n';n.textContent=r.name;
    var m=document.createElement('div');m.className='m';
    var g=document.createElement('span');g.className='tag'+(r.has_html?'':' l');g.textContent=r.has_html?'可直接開':'連結';
    var ti=document.createElement('span');ti.textContent=tm(r.created_at);
    m.appendChild(g);m.appendChild(ti);b.appendChild(t);b.appendChild(n);b.appendChild(m);
    b.addEventListener('click',function(){openWork(r)});
    return b;
  }
  function render(){
    var g=$('grid');g.textContent='';
    rows.slice().reverse().forEach(function(r){g.appendChild(card(r))});
    $('count').textContent=rows.length+' 份作品';
    $('empty').style.display=rows.length?'none':'flex';
  }
  function add(r){if(seen[r.id])return false;seen[r.id]=1;rows.push(r);return true}
  async function load(){
    var r=await sb.from('works').select('id,name,title,link,has_html,created_at').order('id',{ascending:true}).limit(500);
    if(r.error){$('count').textContent='連線有問題：'+r.error.message;return}
    var ch=false;r.data.forEach(function(x){if(add(x))ch=true});
    if(ch)render();
  }
  async function openWork(r){
    $('vt').textContent=r.title+'　·　'+r.name;
    $('viewer').classList.add('on');
    var fr=$('frame'),lv=$('linkview'),vo=$('vopen');
    if(r.has_html){
      lv.style.display='none';fr.style.display='block';vo.style.display='none';fr.srcdoc='<p style="font-family:sans-serif;padding:20px">載入中…</p>';
      var x=await sb.from('works').select('html').eq('id',r.id).single();
      fr.srcdoc=x.error?'<p style="font-family:sans-serif;padding:20px">載入失敗：'+x.error.message.replace(/[<&]/g,'')+'</p>':x.data.html;
    }else{
      fr.style.display='none';fr.srcdoc='';lv.style.display='flex';vo.style.display='none';
      $('lt').textContent=r.title+'　·　'+r.name;$('lu').textContent=r.link;$('lopen').href=r.link;
    }
  }
  function close(){$('viewer').classList.remove('on');$('frame').srcdoc=''}
  $('vx').addEventListener('click',close);
  addEventListener('keydown',function(e){if(e.key==='Escape')close()});
  load();
  sb.channel('works-live').on('postgres_changes',{event:'INSERT',schema:'public',table:'works'},function(p){var n=p.new;n.has_html=!!n.html;delete n.html;if(add(n))render()}).subscribe();
  setInterval(load,5000);
})();
</script>
</body>
</html>
