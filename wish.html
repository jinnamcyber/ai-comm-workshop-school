<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>許願池</title>
<style>
:root{--bg1:#1b1446;--bg2:#0e3b5c;--ink:#f4f1ff;--mut:#b9b3dd;--acc:#ffd166;--acc2:#ff8fab}
*{box-sizing:border-box}
body{margin:0;min-height:100dvh;font-family:-apple-system,"PingFang TC","Noto Sans TC","Microsoft JhengHei",sans-serif;color:var(--ink);background:linear-gradient(160deg,var(--bg1),var(--bg2));display:flex;align-items:center;justify-content:center;padding:20px}
.card{width:100%;max-width:440px;text-align:center}
.star{font-size:56px;line-height:1;filter:drop-shadow(0 0 18px #ffd16688)}
h1{margin:.2em 0 .1em;font-size:30px;letter-spacing:.08em}
p.sub{margin:0 0 22px;color:var(--mut);font-size:16px;line-height:1.6}
textarea{width:100%;height:96px;border-radius:16px;border:2px solid #ffffff33;background:#ffffff14;color:var(--ink);font:inherit;font-size:20px;padding:14px 16px;resize:none;outline:none}
textarea:focus{border-color:var(--acc)}
.row{display:flex;justify-content:space-between;color:var(--mut);font-size:14px;margin:6px 4px 14px}
button{width:100%;border:0;border-radius:999px;padding:16px;font:inherit;font-size:20px;font-weight:700;color:#2a1b00;background:linear-gradient(90deg,var(--acc),var(--acc2));cursor:pointer}
button:disabled{opacity:.5}
.msg{min-height:1.6em;margin-top:16px;font-size:17px}
.ok{color:#9ff0b8}.err{color:#ffb4b4}
.hint{margin-top:18px;color:var(--mut);font-size:14px;line-height:1.6}
</style>
</head>
<body>
<div class="card">
  <div class="star">🌠</div>
  <h1>許願池</h1>
  <p class="sub">今日工作坊之後，你最想要邊樣嘢？<br>一句或者幾個字都得。</p>
  <textarea id="t" maxlength="40" placeholder="例如：多啲備課時間" autocomplete="off"></textarea>
  <div class="row"><span>一句一個願望，想多個就分開許</span><span id="n">0/40</span></div>
  <button id="go">許願 ✨</button>
  <div class="msg" id="msg"></div>
  <div class="hint">你嘅願望會即刻出現喺大螢幕嘅詞雲，匿名顯示。<br>每部手機最多許 5 個。</div>
</div>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.min.js"></script>
<script src="wish-config.js"></script>
<script>
(function(){
  var t=document.getElementById('t'),n=document.getElementById('n'),go=document.getElementById('go'),msg=document.getElementById('msg');
  var LIM=5,KEY='wish_count_v1';
  function cnt(){try{return +localStorage.getItem(KEY)||0}catch(e){return 0}}
  function bump(){try{localStorage.setItem(KEY,String(cnt()+1))}catch(e){}}
  function say(s,c){msg.textContent=s;msg.className='msg '+(c||'')}
  var sb=window.supabase.createClient(WISH_CFG.url,WISH_CFG.key);
  t.addEventListener('input',function(){n.textContent=t.value.length+'/40'});
  go.addEventListener('click',async function(){
    var v=t.value.replace(/\s+/g,' ').trim();
    if(!v){say('先寫低你嘅願望啦','err');return}
    if(cnt()>=LIM){say('呢部手機已經許咗 '+LIM+' 個願望喇，多謝！','err');return}
    go.disabled=true;say('許緊願…');
    var r=await sb.from('wishes').insert({text:v});
    if(r.error){say('傳唔到，請再試一次（'+r.error.message+'）','err');go.disabled=false;return}
    bump();t.value='';n.textContent='0/40';
    say('願望已經飛上大螢幕 ✨ 仲想許就再寫','ok');
    setTimeout(function(){go.disabled=false},2500);
  });
})();
</script>
</body>
</html>
