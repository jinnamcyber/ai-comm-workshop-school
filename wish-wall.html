<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>許願池 · 大螢幕</title>
<style>
:root{--ink:#f4f1ff;--mut:#b9b3dd}
*{box-sizing:border-box}
html,body{margin:0;height:100%;overflow:hidden}
body{font-family:-apple-system,"PingFang TC","Noto Sans TC","Microsoft JhengHei",sans-serif;color:var(--ink);
 background:radial-gradient(ellipse at 50% 40%,#2a1f6b 0%,#1b1446 45%,#0b2a45 100%)}
#stars{position:fixed;inset:0;pointer-events:none}
header{position:fixed;top:0;left:0;right:0;display:flex;justify-content:space-between;align-items:center;padding:14px 22px;z-index:3}
h1{margin:0;font-size:clamp(20px,2.6vw,34px);letter-spacing:.1em}
.tag{color:var(--mut);font-size:clamp(13px,1.4vw,18px)}
#cloud{position:fixed;inset:64px 16px 16px 16px}
.w{position:absolute;white-space:nowrap;font-weight:800;line-height:1;transition:left .6s ease,top .6s ease,font-size .4s ease;
 text-shadow:0 0 14px currentColor;animation:pop .7s cubic-bezier(.2,1.6,.4,1) both}
@keyframes pop{from{opacity:0;transform:scale(.2)}to{opacity:1;transform:scale(1)}}
#empty{position:fixed;inset:0;display:flex;align-items:center;justify-content:center;flex-direction:column;color:var(--mut);font-size:clamp(18px,2.4vw,30px);gap:12px;text-align:center}
#qr{position:fixed;right:18px;bottom:16px;z-index:3;background:#fff;color:#222;border-radius:14px;padding:8px 12px;font-size:14px;text-align:center;display:none}
#qr img{display:block;width:120px;height:120px}
body.showqr #qr{display:block}
#status{position:fixed;left:18px;bottom:12px;color:#ffffff66;font-size:12px;z-index:3}
</style>
</head>
<body>
<canvas id="stars"></canvas>
<header><h1>🌠 許願池</h1><div class="tag" id="count">0 個願望</div></header>
<div id="cloud"></div>
<div id="empty"><div style="font-size:60px">🌠</div><div>掃 QR 許願，願望會喺度長出嚟</div></div>
<div id="qr"><img id="qrimg" alt="QR"><div>掃碼許願</div></div>
<div id="status"></div>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.min.js"></script>
<script src="wish-config.js"></script>
<script>
(function(){
  var COLORS=['#ffd166','#ff8fab','#7ae0ff','#9ff0b8','#c7a6ff','#ffb27a','#fff3b0','#8fb8ff'];
  var cloud=document.getElementById('cloud'),empty=document.getElementById('empty'),countEl=document.getElementById('count'),statusEl=document.getElementById('status');
  var rows=[],seen={},placed={};
  var ctx=document.createElement('canvas').getContext('2d');
  var FONT='-apple-system,"PingFang TC","Noto Sans TC","Microsoft JhengHei",sans-serif';

  function hash(s){var h=2166136261;for(var i=0;i<s.length;i++){h^=s.charCodeAt(i);h=Math.imul(h,16777619)}return h>>>0}
  function split(t){return t.split(/\n+/).map(function(x){return x.replace(/\s+/g,' ').trim()}).filter(Boolean)}

  function build(){
    var map={};
    rows.forEach(function(r){split(r.text).forEach(function(w){
      var k=w.toLowerCase();
      if(!map[k])map[k]={text:w,n:0,first:r.id};
      map[k].n++;
    })});
    var list=Object.keys(map).map(function(k){return Object.assign({key:k},map[k])});
    list.sort(function(a,b){return b.n-a.n||a.first-b.first});
    return list;
  }

  function layout(list){
    var W=cloud.clientWidth,H=cloud.clientHeight;
    var total=list.length,base=Math.max(26,Math.min(64,Math.sqrt(W*H/Math.max(total,1))*.34));
    var max=list.length?list[0].n:1;
    var boxes=[],out=[];
    list.forEach(function(w){
      var size0=Math.round(base*(1+(max>1?(w.n-1)/(max-1):0)*1.4));
      var h=hash(w.key),done=false;
      for(var shrink=1;shrink>.3&&!done;shrink*=.85){
        var size=Math.max(14,Math.round(size0*shrink));
        ctx.font='800 '+size+'px '+FONT;
        var bw=ctx.measureText(w.text).width+16,bh=size*1.15;
        var ang=(h%628)/100,rad=0,x=0,y=0,cx=W/2,cy=H/2;
        for(var i=0;i<3000;i++){
          x=cx+rad*Math.cos(ang)*1.7-bw/2; y=cy+rad*Math.sin(ang)-bh/2;
          ang+=.35; rad+=.14;
          if(x<0||y<0||x+bw>W||y+bh>H)continue;
          var hit=false;
          for(var j=0;j<boxes.length;j++){var b=boxes[j];if(x<b.x+b.w&&x+bw>b.x&&y<b.y+b.h&&y+bh>b.y){hit=true;break}}
          if(!hit){done=true;break}
        }
        if(done){boxes.push({x:x,y:y,w:bw,h:bh});out.push({w:w,x:x,y:y,size:size,color:COLORS[h%COLORS.length]})}
      }
    });
    return out;
  }

  function render(){
    var list=build();
    countEl.textContent=rows.length+' 個願望';
    empty.style.display=rows.length?'none':'flex';
    var out=layout(list),keep={};
    out.forEach(function(o){
      var el=placed[o.w.key];
      if(!el){el=document.createElement('div');el.className='w';placed[o.w.key]=el;cloud.appendChild(el)}
      el.textContent=o.w.text;
      el.style.left=o.x+'px';el.style.top=o.y+'px';el.style.fontSize=o.size+'px';el.style.color=o.color;
      keep[o.w.key]=1;
    });
    Object.keys(placed).forEach(function(k){if(!keep[k]){placed[k].remove();delete placed[k]}});
  }

  function add(r){if(seen[r.id])return;seen[r.id]=1;rows.push(r)}

  var sb=window.supabase.createClient(WISH_CFG.url,WISH_CFG.key);
  async function load(){
    var r=await sb.from('wishes').select('id,text').order('id',{ascending:true}).limit(1000);
    if(r.error){statusEl.textContent='連線有問題：'+r.error.message;return}
    var before=rows.length;r.data.forEach(add);
    if(rows.length!==before)render();
    statusEl.textContent='';
  }
  load().then(render);
  sb.channel('wishes-live').on('postgres_changes',{event:'INSERT',schema:'public',table:'wishes'},function(p){add(p.new);render()}).subscribe();
  setInterval(load,5000); // 保底：即時推送斷咗都會每 5 秒補返
  var t;window.addEventListener('resize',function(){clearTimeout(t);t=setTimeout(render,200)});

  // 背景星星
  var cv=document.getElementById('stars'),c=cv.getContext('2d'),S=[];
  function fit(){cv.width=innerWidth;cv.height=innerHeight;S=[];for(var i=0;i<90;i++)S.push({x:Math.random()*cv.width,y:Math.random()*cv.height,r:Math.random()*1.6+.3,p:Math.random()*6})}
  fit();addEventListener('resize',fit);
  (function tick(ts){c.clearRect(0,0,cv.width,cv.height);S.forEach(function(s){c.globalAlpha=.35+.35*Math.sin(ts/900+s.p);c.fillStyle='#fff';c.beginPath();c.arc(s.x,s.y,s.r,0,6.3);c.fill()});requestAnimationFrame(tick)})(0);

  // ?qr=1 喺角落顯示許願 QR（需要 qr.svg）
  if(/[?&]qr=1/.test(location.search)){document.body.classList.add('showqr');document.getElementById('qrimg').src='wish-qr.svg'}
})();
</script>
</body>
</html>
